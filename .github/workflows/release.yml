# Publishes the plugin to npm with semantic-release.
#
# Hardening notes:
# - Every action is pinned to a full commit SHA (tag in the comment); Dependabot keeps them current.
# - The workflow token is read-only by default. Only the `release` job gets contents:write
#   (tag, CHANGELOG commit, GitHub release) and id-token:write (npm Trusted Publishing, which
#   also produces the provenance attestation).
# - Dependencies are installed with --ignore-scripts, so no dependency lifecycle script ever runs
#   while a write-capable token is in the environment.
# - Checkout does not persist credentials; semantic-release authenticates with GITHUB_TOKEN itself.
# - npm auth: Trusted Publishing first, NPM_TOKEN secret as fallback until OIDC is configured on npmjs.com.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify package exports and server bundle
        run: |
          npm run verify
          npm run verify:runtime

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@12.2.0 --no-audit --no-fund --ignore-scripts

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm Trusted Publishing (OIDC) is tried first. Until a trusted publisher is configured
          # for this package on npmjs.com the exchange returns 404, so semantic-release falls back
          # to the token below (same setup as Magic Session Manager).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --no-install semantic-release

# Runs the full verification (lint, format check, tests, build, package and runtime
# verification) on Node 22, 24 and 26 for every pull request, every push to main
# (the README badge shows the main result), a weekly run that catches dependency
# drift, and manual runs. A separate job installs the declared peer floor
# (Strapi 5.57.0 with Design System 2.2.4) and runs the tests and build against it.
# Read-only token, SHA-pinned actions, no dependency lifecycle scripts.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Dependency gate unit tests
        run: node --test .github/scripts/dependency-gate.test.mjs

      - name: Compatibility canary unit tests
        run: node --test .github/scripts/compat-canary.test.mjs

      - name: Showcase script unit tests
        run: node --test .github/scripts/showcase.test.mjs

      - name: Admin StrictMode tests (React 18)
        run: npm run test:admin

      - name: Build
        run: npm run build

      - name: Verify package exports and server bundle
        run: |
          npm run verify
          npm run verify:runtime

      - name: Package contents
        run: npm pack --dry-run

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # Informational: the peer range is React ^18, like the Strapi 5 admin, and stays so. This job
  # runs the admin StrictMode tests against React 19 (RFC strapi/strapi#25739) to see problems
  # before Strapi moves; a failure here does not block a pull request.
  react-19:
    name: Admin StrictMode tests on React 19 (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Install React 19 (not saved)
        run: npm install --no-save --legacy-peer-deps --ignore-scripts --no-audit --no-fund react@19 react-dom@19

      - name: Show installed React version
        run: node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version"

      - name: Admin StrictMode tests (React 19)
        run: npm run test:admin

  # peerDependencies accept @strapi/strapi and @strapi/plugin-users-permissions
  # ^5.57.0 and the Design System ^2.2.4, while the devDependencies install the
  # newest versions. This job replaces them with the floor so the declared range
  # is tested, not assumed.
  peer-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Install the peer floor (Strapi 5.57.0, Design System 2.2.4)
        run: >-
          npm install --no-save --ignore-scripts --no-audit --no-fund
          @strapi/strapi@5.57.0 @strapi/plugin-users-permissions@5.57.0 @strapi/utils@5.57.0
          @strapi/design-system@2.2.4 @strapi/icons@2.2.4

      - name: Show the installed floor
        run: node -p "['@strapi/strapi','@strapi/utils','@strapi/design-system'].map((p) => p + '@' + require('./node_modules/' + p + '/package.json').version).join(' ')"

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package exports and server bundle
        run: |
          npm run verify
          npm run verify:runtime

  # 8 Node processes against one SQLite file and one PostgreSQL database
  # (tests/multi-instance.test.js). Only better-sqlite3 runs its install
  # script (prebuilt native binding); every other package stays script-free.
  multi-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magicmail
          POSTGRES_PASSWORD: magicmail-ci-only
          POSTGRES_DB: magic_mail_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magicmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Build the SQLite driver
        run: npm rebuild better-sqlite3

      - name: Multi-instance tests (SQLite and PostgreSQL)
        env:
          MAGIC_MAIL_TEST_PG_URL: postgres://magicmail:magicmail-ci-only@127.0.0.1:5432/magic_mail_ci
        run: npm run test:multi-instance

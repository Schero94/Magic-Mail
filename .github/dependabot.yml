# Automatic dependency updates. Patch and minor updates are grouped into one weekly PR
# and merged automatically by .github/workflows/dependency-auto-merge.yml when lint, tests,
# type checks, build and verify all pass. Major updates get their own PR and wait for review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Wait before proposing a release: brand-new versions carry the highest risk
    # of being broken or compromised. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # These versions are set by the Strapi 5 admin that hosts the plugin.
      # A major bump here would break the plugin inside Strapi, so it is never proposed.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-intl'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'styled-components'
        update-types: ['version-update:semver-major']
      - dependency-name: '@strapi/*'
        update-types: ['version-update:semver-major']
      # The Design System and icons follow the version the current Strapi admin
      # ships (devDependency ^2.3.1); the peer floor ^2.2.4 is tested in CI
      # (job peer-floor), so only manual, reviewed bumps move these.
      - dependency-name: '@strapi/design-system'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@strapi/icons'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # @strapi/sdk-plugin 6 builds with TypeScript 5.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    labels: [dependencies]
    groups:
      actions:
        update-types: [minor, patch]

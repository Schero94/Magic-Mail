# Runs the full verification (lint, format check, tests, build, package and runtime
# verification) for every pull request and for manual runs on Node 22 and 24.
# Read-only token, SHA-pinned actions, no dependency lifecycle scripts.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package exports and server bundle
        run: |
          npm run verify
          npm run verify:runtime

      - name: Package contents
        run: npm pack --dry-run

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # 8 Node processes against one SQLite file and one PostgreSQL database
  # (tests/multi-instance.test.js). Only better-sqlite3 runs its install
  # script (prebuilt native binding); every other package stays script-free.
  multi-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magicmail
          POSTGRES_PASSWORD: magicmail-ci-only
          POSTGRES_DB: magic_mail_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magicmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Build the SQLite driver
        run: npm rebuild better-sqlite3

      - name: Multi-instance tests (SQLite and PostgreSQL)
        env:
          MAGIC_MAIL_TEST_PG_URL: postgres://magicmail:magicmail-ci-only@127.0.0.1:5432/magic_mail_ci
        run: npm run test:multi-instance
